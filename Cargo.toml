[package]
name = "oriented-bounding-box"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Finds the tightest oriented box around a polygon, with rotating-calipers min-area, aspect-ratio constrained expansion, and exact aspect-fit rotation."
repository = "https://github.com/Wolren/OrientedBoundingBox"
documentation = "https://docs.rs/oriented-bounding-box"
readme = "README.md"
keywords = ["gis", "geospatial", "geometry", "bounding-box", "rotating-calipers"]
categories = ["science::geo", "algorithms", "mathematics"]
exclude = [".github"]

[package.metadata.docs.rs]
features = ["geo-traits"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "oriented_bounding_box"
path = "src/lib.rs"
crate-type = ["rlib"]

[dev-dependencies]
serde_json = "1.0"

[dependencies]
geo = "0.33.1"
geo-types = "0.7.19"
thiserror = "2"
libc = "0.2"
pyo3 = { version = "0.29", optional = true }
geo-traits = { version = "0.3", optional = true }
hotpath = { version = "0.27", optional = true }
geos = { version = "11.3.1", optional = true, features = ["v3_6_0"] }
rayon = { version = "1.12.0", optional = true }

[features]
default = []
python = ["dep:pyo3"]
extension-module = ["pyo3/extension-module"]
geo-traits = ["dep:geo-traits"]
hotpath = ["dep:hotpath"]
bench-geos = ["dep:geos"]
rayon = ["dep:rayon"]

[[example]]
name = "compare_apples"
required-features = ["bench-geos"]
